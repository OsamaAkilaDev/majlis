name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Integration tests refuse to run against anything not named majlis_test.
  TEST_DATABASE_URL: postgresql://majlis:majlis@localhost:5432/majlis_test?schema=public
  DATABASE_URL: postgresql://majlis:majlis@localhost:5432/majlis_test?schema=public
  DIRECT_URL: postgresql://majlis:majlis@localhost:5432/majlis_test?schema=public
  # Used only by `prisma migrate diff` (see prisma.config.ts) to check the
  # migrations directory still matches schema.prisma. Prisma does not create
  # this database itself for a --from-migrations/--to-schema diff — despite
  # having CREATEDB, it errors with P1003 if the database doesn't already
  # exist — so the step below creates it explicitly first.
  SHADOW_DATABASE_URL: postgresql://majlis:majlis@localhost:5432/majlis_shadow?schema=public
  # apps/web throws rather than silently rewriting /api/v1 to localhost in a
  # production build, so the build step needs this set.
  API_ORIGIN: http://localhost:3001

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: majlis
          POSTGRES_PASSWORD: majlis
          POSTGRES_DB: majlis_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U majlis"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      # No `version:` input on purpose. The root package.json pins
      # `packageManager: pnpm@11.15.0`, which this action reads; supplying
      # both is a known conflict and risks the two drifting apart.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @majlis/api prisma:generate

      # `prisma migrate diff` against a migrations directory needs
      # datasource.shadowDatabaseUrl to already point at a real, existing
      # database — the local `majlis` role has CREATEDB, but Prisma does not
      # use it to create this database on the fly for this command.
      - name: Create shadow database
        run: PGPASSWORD=majlis psql -h localhost -U majlis -d postgres -c "CREATE DATABASE majlis_shadow;"

      - name: Migrations match schema
        run: >
          pnpm --filter @majlis/api exec prisma migrate diff
          --from-migrations prisma/migrations
          --to-schema prisma/schema.prisma
          --exit-code

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      # There is no .env in CI. The `test:integration` script wraps vitest in
      # `dotenv -e ../../.env -c`, and dotenv silently no-ops on a missing
      # file without overriding variables already set — so the job-level env
      # block above is what actually supplies the connection strings.
      - name: Integration tests
        run: pnpm --filter @majlis/api test:integration

      - name: Build
        run: pnpm build

  # The axe accessibility gate lives in this suite. Without this job it would
  # hold for one commit and decay from the next.
  e2e:
    runs-on: ubuntu-latest

    env:
      # apps/api refuses to boot without one, and 32 characters is the floor.
      SESSION_SECRET: ci-only-session-secret-not-a-real-one
      PORT: 3001

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: majlis
          POSTGRES_PASSWORD: majlis
          POSTGRES_DB: majlis_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U majlis"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @majlis/api prisma:generate

      - name: Apply migrations
        run: pnpm --filter @majlis/api prisma:deploy

      # The suite signs in as four seeded personas; an empty database fails
      # every test with a wrong-password error rather than a useful one.
      - name: Seed
        run: pnpm --filter @majlis/api db:seed

      - name: Install Playwright browser
        run: pnpm --filter @majlis/web exec playwright install --with-deps chromium

      # Playwright's own webServer starts Next; only the API is ours to run.
      - name: Start the API
        run: |
          nohup pnpm --filter @majlis/api exec node -r @swc-node/register src/main.ts > api.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://localhost:3001/api/v1/health > /dev/null && exit 0
            sleep 2
          done
          echo "API did not become healthy" >&2
          cat api.log >&2
          exit 1

      - name: End-to-end and accessibility tests
        run: pnpm --filter @majlis/web test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
